name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_snapshot.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_case_matrix.py --out outputs/case_matrix
